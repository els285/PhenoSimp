[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "PhenoSimp"
version = "0.0.1"
authors = [
  { name="Ethan L Simpson", email="ethansimpson285@gmail.com" },
]
description = "Phenomenology package for MadLAD and other tools"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/els285/PhenoSimp/"
Issues = "https://github.com/els285/PhenoSimp//issues"
